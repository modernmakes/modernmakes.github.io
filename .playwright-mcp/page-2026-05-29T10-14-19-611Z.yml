      - heading "Bambu Lab Confirms Free Board Replacement After Fire Reports" [level=1] [ref=e49]
      - generic [ref=e50]:
        - time [ref=e51]: May 28, 2026
        - generic [ref=e52]: ·
        - generic [ref=e53]: 4 min read
    - generic [ref=e55]:
      - article [ref=e56]:
        - paragraph [ref=e57]: Bambu Lab has confirmed a free replacement program for the AC power boards of affected printers after approximately 70 fire incidents were linked to a faulty NTC thermistor component in units manufactured during Q3 2025.
        - heading "How Reports Surfaced" [level=2] [ref=e58]
        - paragraph [ref=e59]: Accounts of overheating and small fires originating from the internal electrical enclosures of certain Bambu Lab desktop printers began appearing on community forums and the r/BambuLab subreddit in late April 2026. Users described burning odors, visible smoke, and in multiple cases open flames, all tracing back to the printer's AC power board.
        - paragraph [ref=e60]: Bambu Lab acknowledged the reports publicly and launched an internal engineering investigation. Within weeks the company identified a root cause and moved to a voluntary, no-cost replacement program covering all confirmed affected units worldwide.
        - 'heading "The Cause: A Faulty NTC Thermistor" [level=2] [ref=e61]'
        - paragraph [ref=e62]: Bambu Lab identified a defective NTC (negative temperature coefficient) thermistor on the AC power board as the source of the failures. The component is responsible for monitoring the board's operating temperature. When the thermistor fails to read accurately, the power board can exceed safe thermal limits without triggering a protective shutdown.
        - paragraph [ref=e63]: In the roughly 70 documented incidents, this condition caused localized overheating severe enough to ignite surrounding materials inside the printer enclosure. The company has not publicly named the component supplier. No injuries have been reported by Bambu Lab in its communications to date.
        - heading "Which Units Are Affected" [level=2] [ref=e64]
        - paragraph [ref=e65]:
          - text: "The issue is limited to a specific production batch from Q3 2025 — not every printer manufactured in that period contains the defective component. Bambu Lab has confirmed that the affected batch can be identified by a single character in the printer's serial number: units where the"
          - strong [ref=e66]: 6th character of the serial number is the letter A
          - text: are from the affected run and should be treated as potentially unsafe until the board is replaced.
        - generic [ref=e67]:
          - generic [ref=e68]: Are you affected?
          - paragraph [ref=e69]: "To determine whether your printer contains the faulty AC power board, locate and read your serial number:"
          - list [ref=e70]:
            - listitem [ref=e71]:
              - text: Find the serial number label on the
              - strong [ref=e72]: rear panel
              - text: or
              - strong [ref=e73]: underside
              - text: of your printer.
            - listitem [ref=e74]:
              - text: Count along the serial number string to the
              - strong [ref=e75]: 6th character
              - text: .
            - listitem [ref=e76]:
              - text: If the 6th character is the letter
              - strong [ref=e77]: A
              - text: ", your unit is from the affected production batch and is eligible for a free replacement board."
            - listitem [ref=e78]: If the 6th character is any other letter or digit, your unit does not contain the faulty component.
          - paragraph [ref=e79]:
            - text: "Example: a serial number reading"
            - code [ref=e80]: BL1F3A8...
            - text: would be affected — the 6th character is
            - strong [ref=e81]: A
            - text: .
        - 'heading "The Fix: Free AC Power Board Replacement" [level=2] [ref=e82]'
        - paragraph [ref=e83]: Bambu Lab is providing a no-cost replacement of the AC power board for all verified affected units. The program does not require proof of purchase and is open to owners worldwide regardless of whether the printer was bought directly from Bambu Lab or through a third-party reseller.
        - paragraph [ref=e84]: Bambu Lab has advised owners of potentially affected units to stop using their printers until the replacement is completed. The company has not issued guidance on any temporary mitigations and recommends discontinuing use as the only safe course of action pending the repair.
        - heading "How to Request a Replacement" [level=2] [ref=e85]
        - list [ref=e86]:
          - listitem [ref=e87]: Confirm your unit is affected using the serial number check above.
          - listitem [ref=e88]:
            - text: Open a support ticket through the
            - strong [ref=e89]: Bambu Lab official support portal
            - text: ", referencing the AC power board replacement program."
          - listitem [ref=e90]: Provide your serial number and shipping address. A Bambu Lab support agent will verify eligibility and arrange dispatch of a replacement board.
        - paragraph [ref=e91]: Bambu Lab has stated that the free replacement program will not have an arbitrary end date applied to it, and that safety-related repairs will be honoured on an ongoing basis. Response times from support may be extended in some regions due to the volume of requests.
        - paragraph [ref=e92]:
          - text: For the most current instructions, region-specific support contact details, and any updates to the replacement process, visit
          - strong [ref=e93]: Bambu Lab's official support page
          - text: directly. The company has not filed a formal product recall with national consumer product safety agencies as of the date this article was published.
