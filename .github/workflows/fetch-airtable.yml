name: Fetch Airtable Data

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily (02:00 ET / 23:00 PT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch Airtable data
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/fetch-airtable.mjs

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/hardware/
          git diff --staged --quiet || git commit -m "chore: sync Airtable hardware data"

      - name: Push changes
        run: git push
