      - generic [ref=e45]:
        - generic [ref=e46]:
          - paragraph [ref=e47]: Polyethylene Terephthalate Glycol
          - heading "PETG" [level=1] [ref=e48]
          - generic [ref=e49]:
            - generic [ref=e50]: RECOMMENDED
            - generic [ref=e51]: The default step up from PLA
          - paragraph [ref=e52]: PETG closes most of the gap between PLA's ease and ABS's toughness. Better heat resistance, better layer adhesion, prints on the same machines. The tradeoff is stringing and a tendency to absorb moisture faster than people expect.
        - generic [ref=e53]:
          - generic [ref=e54]: Print Settings
          - generic [ref=e55]:
            - generic [ref=e56]: Nozzle Temp
            - generic [ref=e57]: 230–250°C
          - generic [ref=e58]:
            - generic [ref=e59]: Bed Temp
            - generic [ref=e60]: 70–90°C
          - generic [ref=e61]:
            - generic [ref=e62]: Chamber
            - generic [ref=e63]: None required
          - generic [ref=e64]:
            - generic [ref=e65]: Cooling Fan
            - generic [ref=e66]: 30–50%
          - generic [ref=e67]:
            - generic [ref=e68]: Max Speed
            - generic [ref=e69]: 120 mm/s
          - generic [ref=e70]:
            - generic [ref=e71]: Heat Deflection
            - generic [ref=e72]: ~80°C
          - generic [ref=e73]:
            - generic [ref=e74]: Difficulty
            - generic [ref=e75]: Beginner
          - generic [ref=e76]: Updated 2026-06-01
    - generic [ref=e78]:
      - article [ref=e79]:
        - generic [ref=e80]:
          - generic [ref=e81]: At a glance
          - generic [ref=e82]:
            - generic [ref=e83]:
              - generic [ref=e84]: Pros
              - list [ref=e85]:
                - listitem [ref=e86]: ✓ Better heat resistance than PLA — functional up to ~80°C vs ~60°C
                - listitem [ref=e87]: ✓ Excellent layer adhesion — nearly isotropic strength
                - listitem [ref=e88]: ✓ Chemical resistance — handles mild acids, fuels, water
                - listitem [ref=e89]: ✓ Flexible enough to avoid brittleness at thin walls
                - listitem [ref=e90]: ✓ Food-safe when printed correctly (though layer gaps prevent sterilization)
            - generic [ref=e91]:
              - generic [ref=e92]: Cons
              - list [ref=e93]:
                - listitem [ref=e94]: ✗ Strings more than PLA — requires tuning
                - listitem [ref=e95]: ✗ Absorbs moisture faster than PLA — store sealed
                - listitem [ref=e96]: ✗ Bonds permanently to smooth PEI — use textured sheet only
                - listitem [ref=e97]: ✗ Enclosed chambers can cause warping if ambient runs hot
                - listitem [ref=e98]: ✗ Scratch resistance is poor compared to ABS or ASA
        - generic [ref=e99]:
          - generic [ref=e100]: Overview
          - generic [ref=e101]:
            - paragraph [ref=e102]: "PETG is the filament you reach for when PLA isn’t tough enough but you don’t want to deal with ABS. Better heat resistance, better impact strength, prints on the same machines with minimal changes. The catch: it strings, it sticks too aggressively to smooth surfaces, and it drinks moisture faster than PLA."
            - paragraph [ref=e103]: Get a textured PEI sheet if you don’t have one. Keep retraction short — PETG doesn’t like long pulls. And dry it before any print that matters. Do those three things and PETG is nearly as easy as PLA.
            - paragraph [ref=e104]: "Use it for: tool holders, cable clips, brackets, anything in a car or garage, functional enclosures, parts that need to survive dishwashers."
            - paragraph [ref=e105]: "Don’t use it for: outdoor UV exposure (use ASA), high-temp applications above 80°C (use ABS or PA), or anything that needs to be very rigid and thin (use ASA or ABS)."
        - generic [ref=e106]:
          - generic [ref=e107]: Brand Recommendations
          - generic [ref=e108]:
            - generic [ref=e109]:
              - generic [ref=e110]:
                - generic [ref=e111]: Bambu Lab PETG-HF
                - generic [ref=e112]: TOP
              - generic [ref=e113]: $24.99/kg
              - paragraph [ref=e114]: Tuned for Bambu printers but runs well on anything. High-flow variant pushes past 200mm/s on a capable hotend. Consistent diameter.
            - generic [ref=e115]:
              - generic [ref=e116]:
                - generic [ref=e117]: Prusament PETG
                - generic [ref=e118]: TOP
              - generic [ref=e119]: $29.99/kg
              - paragraph [ref=e120]: Best-in-class consistency. Runs exactly at published settings. More colors than most. Worth the price on anything that matters.
            - generic [ref=e121]:
              - generic [ref=e122]:
                - generic [ref=e123]: Polymaker PolyLite PETG
                - generic [ref=e124]: MID
              - generic [ref=e125]: $19.99/kg
              - paragraph [ref=e126]: Reliable workhorse. Slightly more stringing than premium options. Fine for functional parts where appearance doesn't matter.
            - generic [ref=e127]:
              - generic [ref=e128]:
                - generic [ref=e129]: Hatchbox PETG
                - generic [ref=e130]: MID
              - generic [ref=e131]: $22.99/kg
              - paragraph [ref=e132]: Widely available, consistent, no surprises. Good default if you can't get Prusament. Diameter tolerance is adequate.
            - generic [ref=e133]:
              - generic [ref=e134]:
                - generic [ref=e135]: SUNLU PETG
                - generic [ref=e136]: BUDGET
              - generic [ref=e137]: $14.99/kg
              - paragraph [ref=e138]: Works but strings aggressively. Dry it before use without exception. Fine for throw-away prototypes.
        - generic [ref=e139]:
          - generic [ref=e140]: Troubleshooting
          - generic [ref=e141]:
            - generic [ref=e142]:
              - generic [ref=e143]: Stringing
              - generic [ref=e144]:
                - generic [ref=e145]:
                  - generic [ref=e146]: Cause
                  - generic [ref=e147]: Too high temp, too low retraction, or wet filament
                - generic [ref=e148]:
                  - generic [ref=e149]: Fix
                  - generic [ref=e150]: Drop temp 5°C. Increase retraction 0.5mm at a time. Dry filament 65°C for 4–6 hours.
            - generic [ref=e151]:
              - generic [ref=e152]: Bed adhesion failure
              - generic [ref=e153]:
                - generic [ref=e154]:
                  - generic [ref=e155]: Cause
                  - generic [ref=e156]: Wrong surface, contaminated PEI, or bed temp too low
                - generic [ref=e157]:
                  - generic [ref=e158]: Fix
                  - generic [ref=e159]: Textured PEI sheet at 85°C. Clean with IPA before every print. Avoid smooth PEI — PETG bonds too aggressively and can pull chunks.
            - generic [ref=e160]:
              - generic [ref=e161]: Layer delamination
              - generic [ref=e162]:
                - generic [ref=e163]:
                  - generic [ref=e164]: Cause
                  - generic [ref=e165]: Too much cooling or printing too fast
                - generic [ref=e166]:
                  - generic [ref=e167]: Fix
                  - generic [ref=e168]: Reduce fan to 30%. Slow perimeters to 60mm/s. PETG needs heat to bond layers.
            - generic [ref=e169]:
              - generic [ref=e170]: Zits and blobs
              - generic [ref=e171]:
                - generic [ref=e172]:
                  - generic [ref=e173]: Cause
                  - generic [ref=e174]: Pressure imbalance at seams
                - generic [ref=e175]:
                  - generic [ref=e176]: Fix
                  - generic [ref=e177]: Enable Seam Painting in OrcaSlicer to hide seams. Tune pressure advance.
            - generic [ref=e178]:
              - generic [ref=e179]: Poor overhang performance
              - generic [ref=e180]:
                - generic [ref=e181]:
                  - generic [ref=e182]: Cause
                  - generic [ref=e183]: PETG sags more than PLA at the same fan speed
                - generic [ref=e184]:
                  - generic [ref=e185]: Fix
                  - generic [ref=e186]: Increase fan to 50% on overhangs specifically. Slow overhang speed to 30mm/s.
