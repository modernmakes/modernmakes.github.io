<title>Modern Makes Feel Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1A1A1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout concept: the real Modern Makes hotend index and detail page, rebuilt as an app shell —
   dark glass nav pinned on top, dark hero band, light editorial body, sheets and palette in the top layer.
   One committed look (the site's own light page + dark chrome), so colours are set explicitly, not themed. */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
:root {
  color-scheme: light;
  /* brand tokens (global.css) */
  --accent: #FF5A1F; --accent-dk: #C93B08; --accent-t: #FFE9E1;
  --ink: #1A1A1A; --g1: #5A5A5A; --g2: #8C8C8C;
  --bg: #F7F6F3; --surface: #FFFFFF; --border: #E2E2E0; --border-s: #C8C8C5;
  --dark: #1A1A1A; --dark-2: #222222; --dark-line: rgba(255,255,255,.08);
  --media: #101118; --stage: #050506;
  --wh: #15803D; --wh-t: #E8F8EE; --be: #1D4ED8; --be-t: #E8EFFD;
  --ok: #2E7D32;
  /* type */
  --fd: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --fu: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --fb: 'Lora', Georgia, serif;
  --fm: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  /* motion tokens (PRD) */
  --dur-press: 80ms; --dur-fast: 150ms; --dur-base: 220ms; --dur-page: 280ms; --dur-sheet: 450ms;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-move: cubic-bezier(0.65, 0, 0.35, 1);
  --spring-snap: var(--ease-out);
  --spring-sheet: var(--ease-out);
  --nav-h: 56px;
  --max-w: 1200px;
}
@supports (transition-timing-function: linear(0, 1)) {
  :root {
    --spring-snap: linear(0, 0.0138, 0.0497, 0.1006, 0.161, 0.2268, 0.2947, 0.3624, 0.4281, 0.4907, 0.5494, 0.6037, 0.6534, 0.6985, 0.7391, 0.7753, 0.8074, 0.8358, 0.8606, 0.8822, 0.9009, 0.9171, 0.931, 0.9429, 0.953, 0.9615, 0.9687, 0.9747, 0.9798, 0.9839, 0.9874, 0.9902, 0.9925, 0.9944, 0.9959, 0.9971, 1);
    --spring-sheet: linear(0, 0.0216, 0.0768, 0.1537, 0.2428, 0.3369, 0.4308, 0.5206, 0.6039, 0.6791, 0.7456, 0.8032, 0.852, 0.8927, 0.926, 0.9526, 0.9734, 0.9893, 1.001, 1.0092, 1.0147, 1.018, 1.0196, 1.0199, 1.0193, 1.0181, 1.0165, 1.0147, 1.0129, 1.011, 1.0092, 1.0076, 1.0061, 1.0048, 1.0037, 1.0028, 1);
  }
}
@media (min-width: 768px) { :root { --nav-h: 64px; } }

html { scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--fu); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--dark); }
::selection { background: var(--accent-t); color: var(--ink); }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
img { display: block; max-width: 100%; height: auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { text-wrap: pretty; margin: 0; }
.mono { font-family: var(--fm); }
.wrap { max-width: var(--max-w); margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow { font-family: var(--fm); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }

/* ── PRESS SYSTEM ─────────────────────────────────────────────── */
.press { --sc: .97; transition: transform 300ms var(--spring-snap), background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); }
.press:active { transform: scale(var(--sc)); transition-duration: var(--dur-press); transition-timing-function: var(--ease-out); }
.press.chip { --sc: .96; } .press.icon { --sc: .92; }
html.rm .press:active { transform: none; opacity: .72; }

/* ── NAV ──────────────────────────────────────────────────────── */
#app { transform-origin: 50% 0; }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: var(--nav-h); background: rgba(20,20,20,.86); -webkit-backdrop-filter: saturate(160%) blur(20px); backdrop-filter: saturate(160%) blur(20px); border-bottom: 1px solid var(--dark-line); color: #fff; view-transition-name: nav; }
.nav-inner { height: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
.nav-left { display: flex; align-items: center; gap: 4px; min-width: 0; }
.logo { display: flex; align-items: center; height: 44px; padding-inline: 4px; border-radius: 8px; }
.logo .lm { width: 28px; height: 28px; }
.logo .wm { height: 22px; width: auto; display: none; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; color: rgba(255,255,255,.72); position: relative; }
.icon-btn svg { width: 22px; height: 22px; }
.back-btn { margin-left: -10px; color: #fff; }
.nav-center { position: relative; pointer-events: none; height: 100%; display: flex; align-items: center; justify-content: center; min-width: 0; }
.nav-title { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--fd); font-weight: 800; font-size: 19px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: translateY(6px); transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); pointer-events: none; }
.nav-title span { overflow: hidden; text-overflow: ellipsis; }
.nav.show-title .nav-title { opacity: 1; transform: none; }
.nav-links { display: none; }
.nav-right { display: flex; align-items: center; gap: 2px; }
.search-btn { display: none; }
.badge { position: absolute; top: 6px; right: 4px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: #fff; font: 700 10px/17px var(--fm); text-align: center; font-variant-numeric: tabular-nums; }
.badge[data-n="0"] { display: none; }
.extrude { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; pointer-events: none; opacity: 0; --p: 0; transition: --p 1.8s cubic-bezier(.08,.7,.18,1); }
.extrude.run { opacity: 1; }
.extrude b { position: absolute; inset: 0; background: var(--accent); clip-path: inset(0 calc((1 - var(--p)) * 100%) 0 0); }
.extrude i { position: absolute; top: -2px; left: calc(var(--p) * 100%); width: 6px; height: 6px; border-radius: 50%; background: #FFE3D6; box-shadow: 0 0 10px 3px rgba(255,90,31,.75); transform: translateX(-50%); }
.extrude.done { transition: --p 180ms var(--ease-out), opacity 220ms 200ms var(--ease-out); opacity: 0; }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: rgba(255,255,255,.55); transform-origin: left; transform: scaleX(var(--read, 0)); opacity: 0; transition: opacity var(--dur-base) var(--ease-out); }
.progress.on { opacity: 1; }
/* centre slot: brand at rest, page title once the big title leaves (mobile) */
.nav-brand { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); }
.nav-brand img { height: 27px; width: auto; }
.nav.show-title .nav-brand { opacity: 0; transform: translateY(-6px); }
.back-btn { width: auto; padding: 0 10px 0 2px; gap: 0; display: inline-flex; font: 600 16px var(--fu); color: #fff; }
.back-btn svg { width: 24px; height: 24px; }
.wb-lbl { display: none; }
@media (max-width: 767px) { .nav .logo { display: none; } .on-detail .menu-btn { display: none; } }
@media (min-width: 768px) {
  .logo .lm { display: none; } .logo .wm { display: block; }
  .nav-inner { grid-template-columns: auto 1fr auto; }
  .nav-links, .nav-center { grid-column: 2; grid-row: 1; }
  .nav-center { justify-content: flex-start; }
  .nav-title { justify-content: flex-start; padding-left: 14px; }
  .nav-title::before { content: "/"; color: rgba(255,255,255,.3); margin-right: 10px; font-weight: 700; }
  .nav-links { display: flex; gap: 2px; justify-content: flex-start; padding-left: 12px; }
  .nav.show-title .nav-links { opacity: 0; pointer-events: none; }
  .nav-links { transition: opacity var(--dur-base) var(--ease-out); }
  .nav-link { height: 40px; padding: 0 12px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; font: 600 13px var(--fu); color: rgba(255,255,255,.55); position: relative; }
  .nav-link[aria-current] { color: #fff; }
  .nav-link[aria-current]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 4px; height: 2px; background: var(--accent); border-radius: 1px; }
  .nav-link svg { width: 14px; height: 14px; }
  .search-btn { display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px 0 12px; margin-right: 6px; border-radius: 8px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); color: rgba(255,255,255,.5); font: 500 13px var(--fu); min-width: 200px; }
  .search-btn svg { width: 16px; height: 16px; }
  .search-btn kbd { margin-left: auto; font: 500 11px var(--fm); color: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.12); border-radius: 5px; padding: 1px 6px; }
  .nav-right .search-icon, .menu-btn, .nav-brand, .back-lbl { display: none; }
  .wb-btn { width: auto; padding: 0 12px 0 10px; gap: 8px; display: inline-flex; align-items: center; font: 600 13px var(--fu); color: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.1); height: 36px; border-radius: 8px; }
  .wb-btn svg { width: 18px; height: 18px; }
  .wb-lbl { display: inline; }
  .wb-btn .badge { position: static; }
  .back-btn { margin-left: -12px; }
}
@media (hover: hover) and (pointer: fine) {
  .icon-btn:hover { background: rgba(255,255,255,.07); color: #fff; }
  .nav-link:hover { color: #fff; background: rgba(255,255,255,.06); }
  .search-btn:hover { border-color: rgba(255,255,255,.18); color: rgba(255,255,255,.75); }
  .logo:hover { background: rgba(255,255,255,.05); }
}

/* ── INDEX ─────────────────────────────────────────────────────── */
.hero { background: var(--dark); color: #fff; padding-block: 22px 28px; }
.crumbs { display: flex; gap: 8px; align-items: center; font: 400 12px var(--fm); color: rgba(255,255,255,.5); margin-bottom: 14px; flex-wrap: wrap; }
.crumbs a { color: rgba(255,255,255,.75); padding-block: 6px; }
.light .crumbs { color: var(--g2); } .light .crumbs a { color: var(--g1); }
.large-title { font-family: var(--fd); font-weight: 800; font-size: clamp(44px, 9vw, 72px); line-height: .95; letter-spacing: -.01em; }
.lede { font-family: var(--fb); font-size: 16px; line-height: 1.7; color: rgba(255,255,255,.72); max-width: 60ch; margin-top: 12px; }
.context-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 20px; }
.printer-chip { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px 0 12px; border-radius: 8px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); font: 600 13px var(--fu); color: rgba(255,255,255,.9); }
.printer-chip svg { width: 16px; height: 16px; opacity: .7; }
.printer-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g2); }
.printer-chip.set .dot { background: #4ADE80; }
.fresh { font: 400 11px var(--fm); color: rgba(255,255,255,.45); }
.proto-hint { margin-top: 18px; font: 400 12px/1.6 var(--fm); color: rgba(255,255,255,.55); max-width: 70ch; }
.proto-hint b { color: #FFB59A; font-weight: 500; }
.hint-link { font: 500 12px var(--fm); color: #fff; background: rgba(255,90,31,.18); border: 1px solid rgba(255,90,31,.5); border-radius: 6px; padding: 2px 8px; margin: 0 2px; min-height: 28px; }
@media (hover: hover) and (pointer: fine) { .hint-link:hover { background: rgba(255,90,31,.3); } }

.tabs-bar { background: var(--surface); border-bottom: 1px solid var(--border); position: relative; z-index: 2; }
.seg { position: relative; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg-btn { height: 48px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; font: 700 12px var(--fu); letter-spacing: .08em; text-transform: uppercase; color: var(--g1); white-space: nowrap; }
.seg-btn[aria-selected="true"] { color: var(--ink); }
.seg-btn:disabled { opacity: .4; cursor: default; }
.seg-btn .n { font: 700 10px var(--fm); padding: 1px 6px; border-radius: 9px; background: var(--bg); border: 1px solid var(--border); color: var(--g1); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.seg-btn[aria-selected="true"] .n { background: var(--accent); border-color: var(--accent); color: #fff; }
.flow-row { display: flex; align-items: center; gap: 6px; padding-block: 16px 16px; border-top: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.flow-row::-webkit-scrollbar { display: none; }
.flow-row .lbl { font: 500 10px var(--fm); letter-spacing: .12em; text-transform: uppercase; color: var(--g2); margin-right: 4px; white-space: nowrap; }
.flow-btn { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--border-s); background: var(--surface); font: 600 13px var(--fu); color: var(--g1); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.flow-btn .n { font: 500 10px var(--fm); color: var(--g2); font-variant-numeric: tabular-nums; }
.flow-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.flow-btn[aria-pressed="true"] .n { color: rgba(255,255,255,.6); }
.flow-btn:disabled { opacity: .4; cursor: default; }
.rate-btn { display: none; margin-left: auto; min-height: 36px; padding: 0 4px 0 12px; display: inline-flex; align-items: center; gap: 6px; font: 600 13px var(--fu); color: var(--g1); white-space: nowrap; }
.rate-btn svg { width: 16px; height: 16px; }
@media (min-width: 768px) { .rate-btn { display: inline-flex; } }
@media (hover: hover) and (pointer: fine) { .rate-btn:hover { color: var(--ink); } }
.legend-link { font: inherit; color: var(--accent-dk); text-decoration: underline; text-underline-offset: 2px; padding: 4px 0; }
button.verdict { cursor: pointer; border: 0; font-family: var(--fu); }
.verdict.bm { color: #fff; background: var(--ink); }
.verdict.sk { color: #B23C00; background: #FFF3E0; }
.rate-list { display: grid; }
.rate-row { display: grid; grid-template-columns: 1fr; gap: 6px 14px; padding: 14px 0; border-bottom: 1px solid var(--border); align-items: start; }
.rate-row:last-child { border-bottom: 0; }
@media (min-width: 560px) { .rate-row { grid-template-columns: 112px 1fr; } }
.rate-row .verdict, .rate-row .flow-chip { justify-self: start; margin-top: 2px; }
.rate-row .m { font: 600 15px/1.4 var(--fu); color: var(--ink); }
.rate-row .d { font: 400 14px/1.55 var(--fb); color: var(--g1); margin-top: 2px; }
.rate-h { font: 800 20px var(--fd); margin: 18px 0 2px; }
.rate-h:first-child { margin-top: 0; }
.rate-lead { font: 400 15px/1.6 var(--fb); color: var(--g1); margin-bottom: 6px; }
.rate-note { font: 400 11px/1.5 var(--fm); color: var(--g2); margin-top: 14px; }
@media (hover: hover) and (pointer: fine) { .flow-btn:not([aria-pressed="true"]):not(:disabled):hover { border-color: var(--ink); color: var(--ink); } }
.no-match { display: none; text-align: center; padding: 40px 16px; color: var(--g1); }
.no-match.on { display: block; }
.no-match h3 { font: 800 22px var(--fd); color: var(--ink); margin-bottom: 6px; }
.no-match p { font-family: var(--fb); margin-bottom: 14px; }
.seg-ind { position: absolute; left: 0; bottom: 0; height: 2px; width: 10px; background: var(--accent); transform-origin: left; transition: transform 380ms var(--spring-sheet), width 380ms var(--spring-sheet); }
@media (hover: hover) and (pointer: fine) { .seg-btn:hover { color: var(--ink); } }

.grid-wrap { padding-block: 22px 40px; }
.count { font: 400 12px var(--fm); color: var(--g1); margin-bottom: 14px; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; --lift: 0px; --sc: 1; transform: translateY(var(--lift)) scale(var(--sc)); transition: transform 320ms var(--spring-snap), border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-base) var(--ease-out); view-transition-class: card; }
.card:active:not(:has(.save-btn:active)) { --sc: .985; border-color: var(--border-s); transition-duration: var(--dur-press); transition-timing-function: var(--ease-out); }
html.rm .card:active { --sc: 1; opacity: .8; }
.card-link { display: block; }
.card-media { position: relative; background: var(--media); aspect-ratio: 4 / 3; overflow: hidden; }
.card-img { width: 100%; height: 100%; object-fit: contain; transition: transform 500ms var(--ease-out); }
.card-media .media-tag { position: absolute; left: 14px; bottom: 12px; font: 500 10px var(--fm); letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.55); }
.card-body { padding: 14px 16px 16px; display: grid; gap: 8px; }
.card-title { font: 800 21px/1.1 var(--fd); letter-spacing: -.005em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.spec-chip { font: 400 11px var(--fm); padding: 2px 7px; border-radius: 3px; background: var(--bg); border: 1px solid var(--border); color: var(--g1); font-variant-numeric: tabular-nums; }
.card-desc { font-family: var(--fb); font-size: 14px; line-height: 1.6; color: var(--g1); }
.card-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }
.verdict { font: 700 11px var(--fu); padding: 3px 8px; border-radius: 4px; letter-spacing: .02em; white-space: nowrap; }
.verdict.wh { color: var(--wh); background: var(--wh-t); }
.verdict.be { color: var(--be); background: var(--be-t); }
.verdict.lg { font-size: 13px; padding: 5px 10px; }
.fit { font: 500 11px var(--fm); color: var(--g1); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.fit::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--border-s); }
.fit.yes { color: var(--wh); } .fit.yes::before { background: var(--wh); }
.price { margin-left: auto; font: 800 20px var(--fd); color: var(--accent-dk); font-variant-numeric: tabular-nums; }
.save-btn { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; display: grid; place-items: center; z-index: 2; }
.save-btn span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(20,20,22,.55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.85); transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
.save-btn svg { width: 16px; height: 16px; }
.save-btn[aria-pressed="true"] span { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (hover: hover) and (pointer: fine) {
  .card:hover { --lift: -1px; border-color: var(--accent); box-shadow: 0 8px 24px rgba(255,90,31,.08); }
  .card:hover .card-img { transform: scale(1.02); }
  .save-btn:hover span { background: rgba(20,20,22,.8); }
  .save-btn[aria-pressed="true"]:hover span { background: var(--accent-dk); }
}
html.rm .card:hover { --lift: 0px; } html.rm .card:hover .card-img { transform: none; }

.try { margin-top: 28px; background: var(--surface); border: 1px dashed var(--border-s); border-radius: 10px; padding: 18px 18px 16px; }
.try h2 { font: 800 18px var(--fd); margin-bottom: 8px; }
.try ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; color: var(--g1); }
.try b { color: var(--ink); font-weight: 600; }

/* ── DETAIL ────────────────────────────────────────────────────── */
.d-media { background: var(--media); }
.d-media-inner { display: grid; place-items: center; padding-block: 8px; }
.d-img { width: min(100%, 520px); aspect-ratio: 4 / 3; object-fit: contain; }
.d-top { background: var(--surface); border-bottom: 1px solid var(--border); }
.d-head { padding-block: 20px 26px; }
.d-wrap { padding-block: 4px 56px; }
.d-head .large-title { font-size: clamp(40px, 8vw, 64px); color: var(--ink); margin-top: 6px; }

.sub-btn { position: relative; min-width: 140px; }

/* ── VIEW TRANSITIONS ─────────────────────────────────────────── */
::view-transition-group(*) { animation-duration: 320ms; animation-timing-function: var(--ease-move); }
::view-transition-group(nav) { animation: none; }
::view-transition-old(nav), ::view-transition-new(nav) { animation-duration: var(--dur-fast); }
html[data-dir]::view-transition-old(root) { animation: var(--dur-page) var(--ease-out) both vt-out; }
html[data-dir]::view-transition-new(root) { animation: var(--dur-page) var(--ease-out) both vt-in; }
html[data-dir="back"]::view-transition-old(root) { animation-name: vt-out-back; }
html[data-dir="back"]::view-transition-new(root) { animation-name: vt-in-back; }
::view-transition-group(zoom) { animation-duration: 440ms; animation-timing-function: cubic-bezier(0.2, 0.9, 0.24, 1); z-index: 2; overflow: clip; }
::view-transition-image-pair(zoom) { overflow: clip; }
::view-transition-old(zoom), ::view-transition-new(zoom) { width: 100%; height: auto; min-height: 100%; object-fit: cover; object-position: top center; }
::view-transition-old(zoom) { animation: 220ms var(--ease-out) both fade-out; }
::view-transition-new(zoom) { animation: 300ms 60ms var(--ease-out) both fade-in; }
html[data-dir="back"]::view-transition-old(zoom) { animation-duration: 260ms; animation-delay: 60ms; }
html[data-dir="back"]::view-transition-new(zoom) { animation-duration: 220ms; animation-delay: 0ms; }
@keyframes vt-in { from { opacity: 0; transform: translateY(14px); } }
@keyframes vt-out { to { opacity: 0; transform: scale(.97); } }
@keyframes vt-in-back { from { opacity: 0; transform: scale(.97); } }
@keyframes vt-out-back { to { opacity: 0; transform: translateY(14px); } }
html[data-dir="fwd"]::view-transition-new(root) { animation-delay: 90ms; animation-duration: 340ms; }
html.rm[data-dir]::view-transition-old(root) { animation: var(--dur-fast) linear both fade-out; }
html.rm[data-dir]::view-transition-new(root) { animation: var(--dur-fast) linear both fade-in; }
@keyframes fade-out { to { opacity: 0; } } @keyframes fade-in { from { opacity: 0; } }

/* ── PALETTE ──────────────────────────────────────────────────── */

/* sheet drag: velocity-aware dismiss and detents */
(() => {
  let drag = null;
  const start = (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest('button:not(.grab)') && !e.target.closest('.grab')) return;
    drag = { y0: e.clientY, base: sheetState.y, samples: [{ y: e.clientY, t: e.timeStamp }], id: e.pointerId };
    e.currentTarget.setPointerCapture?.(e.pointerId);
  };
  const move = (e) => {
    if (!drag || e.pointerId !== drag.id) return;

    drag.samples.push({ y: e.clientY, t: e.timeStamp });
    if (drag.samples.length > 6) drag.samples.shift();
  };

    const s = drag.samples; const a = s[0], b = s[s.length - 1];
    const v = (b.t - a.t) > 0 ? (b.y - a.y) / (b.t - a.t) : 0;
    const y = sheetState.y; const H = sheetState.H;
    const moved = Math.abs(e.clientY - drag.y0);
    const drag0 = drag.base;
    drag = null;
    if (moved < 4) { setY(sheetState.detents && narrowQ.matches && y > 1 ? y : Math.max(0, y), true); return; }
    if (sheetState.detents && narrowQ.matches) {
      const med = mediumY(); const proj = y + v * 220;
      const targets = [0, med, H];
      const pick = targets.reduce((best, t) => Math.abs(t - proj) < Math.abs(best - proj) ? t : best, targets[0]);
      if (pick === H || v > 1.2) closeSheet(); else { if (pick !== drag0) tick('soft'); setY(pick, true); }
    } else {
      if (v > 0.5 || y > H * 0.4) closeSheet(); else setY(0, true);
    }
  };
  $$('.grab, .sheet-head', panel).forEach(el => {
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });
})();

  const gc = t.closest('[data-go-close]'); if (gc) { closeSheet(); setTimeout(() => go(gc.dataset.goClose), 200); return; }
  const sv = t.closest('[data-save]'); if (sv) { toggleSave(sv.dataset.save); return; }
  const us = t.closest('[data-unsave]'); if (us) { toggleSave(us.dataset.unsave); return; }
  if (t.closest('[data-wbpage]')) { closeSheet(); setTimeout(() => go('workbench'), 220); return; }
  const pk = t.closest('[data-pick]'); if (pk) { setActive(pk.dataset.pick); return; }
  const st = t.closest('[data-status]');
  if (st) { const row = st.closest('.wb-item'); const it = listOf(row.dataset.src).find(x => x.slug === row.dataset.slug); if (it) { it.status = st.dataset.status; saveWB(); tick('soft'); refreshAll(); } return; }
  const qb = t.closest('[data-qty]');
  if (qb) { const row = qb.closest('.wb-item'); const it = listOf(row.dataset.src).find(x => x.slug === row.dataset.slug); if (it) { it.qty = Math.max(1, it.qty + +qb.dataset.qty); saveWB(); tick('soft'); refreshAll(); } return; }
  const mv = t.closest('[data-move]'); if (mv) { const row = mv.closest('.wb-item'); openMove(mv.dataset.move, row.dataset.src); return; }
  const mt = t.closest('[data-moveto]'); if (mt) { const s = sheetState.moveSlug, src = sheetState.moveSrc; closeSheet(); moveItem(s, src, mt.dataset.moveto); return; }
  const rmv = t.closest('[data-wbremove]');
  if (rmv) { const row = rmv.closest('.wb-item'); const list = listOf(row.dataset.src); const idx = list.findIndex(x => x.slug === row.dataset.slug); if (idx > -1) { const [gone] = list.splice(idx, 1); saveWB(); tick('soft'); refreshAll(); toast(`Removed ${esc(BY[gone.slug].name)}`, { label: 'Undo', run: () => { list.splice(idx, 0, gone); saveWB(); refreshAll(); } }); } return; }
  if (t.closest('[data-assignall]')) { const b = activeBuild(); if (b) { WB.unsorted.forEach(i => { const ex = b.items.find(x => x.slug === i.slug); if (ex) ex.qty += i.qty; else b.items.push(i); }); WB.unsorted = []; saveWB(); tick(); refreshAll(); toast(`Moved into ${esc(b.name)}`); } return; }
  const del = t.closest('[data-delbuild]');
  if (del) {
    if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = 'Tap again to delete this build and its parts list'; tick('soft'); setTimeout(() => { if (del.isConnected) { del.classList.remove('armed'); del.textContent = 'Delete this build'; } }, 3500); return; }
    const id = del.dataset.delbuild; const b = WB.builds.find(x => x.id === id); WB.builds = WB.builds.filter(x => x.id !== id); WB.active = WB.builds[0]?.id || null; saveWB(); tick('error'); refreshAll();
    toast(`Deleted ${esc(b.name)}`, { label: 'Undo', run: () => { WB.builds.push(b); WB.active = b.id; saveWB(); refreshAll(); } }); return;
  }
  const ex = t.closest('[data-export]');
  if (ex) {
    const scope = $('#expScope')?.value || 'one'; const k = ex.dataset.export;
    if (k === 'csv') copyText(toCSV(scope), 'CSV copied. Paste it into a spreadsheet.');
    else if (k === 'text') copyText(toText(scope), 'Copied as text');
    else if (k === 'pdf') toast('Prototype: opens the print dialog on the live site');
    else if (k === 'link') { let enc = ''; try { enc = btoa(unescape(encodeURIComponent(JSON.stringify(exportRows(scope).map(b => ({ n: b.name, p: b.printer, i: b.items.map(i => [i.slug, i.qty, i.status[0]]) })))))); } catch {} copyText('https://modernmakes.github.io/workbench#b=' + enc, 'Share link copied. It opens once the Workbench is live.'); }
    return;
  }
  const fl = t.closest('[data-filter]'); if (fl) { setFilter(fl.dataset.filter); return; }
  const fw = t.closest('[data-flow]'); if (fw && fw.classList.contains('flow-btn')) { setFlow(fw.dataset.flow); return; }
  if (t.closest('[data-clear]')) { state.flow = 'x'; setFlow('all'); setFilter('all'); return; }
  const op = t.closest('[data-open]'); if (op) { const k = op.dataset.open; if (k === 'palette') openPalette(); else openSheet(k); return; }
  if (t.closest('[data-close]')) { closeSheet(); return; }
  if (t.closest('[data-pclose]')) { closePalette(); return; }
  const cp = t.closest('[data-copy]'); if (cp) { copyVal(cp); return; }
  const by = t.closest('[data-buy]');
  if (by) { const it = BY[by.dataset.buy]; if (narrowQ.matches) { sheetState.buySlug = it.slug; openSheet('buy'); } else openPopover(by, buyRows(it, 'pop-item') + `<p class="pop-note">Prototype: affiliate links open the vendor on the live site.</p>`); return; }
  const pb = t.closest('[data-proto-buy]'); if (pb) { closePopover(); toast(`Prototype: opens ${esc(pb.dataset.protoBuy)} in a new tab`); return; }
  const pr = t.closest('[data-proto]'); if (pr) { closePopover(); if (dlg.open) closeSheet(); toast(`Prototype: only Hardware → Hotends is built. ${esc(pr.dataset.proto)} opens on the live site.`); return; }
  if (t.closest('#printersBtn')) { openPopover($('#printersBtn'), ['Voron · 2.4, Trident', 'RatRig · V-Core', 'VzBot · coming', 'HevORT · coming'].map(x => { const [a, b] = x.split(' · '); return `<button class="pop-item" data-proto="${a}"><span class="grow"><span class="t">${a}</span><br><span class="s">${b}</span></span></button>`; }).join('')); return; }
  if (t.closest('[data-copylist]')) {
    const text = itemsText(activeList()) + `\nEstimated total ${fmtPrice(listTotal(activeList()))} at listed prices`;
    try { navigator.clipboard.writeText(text).then(() => { tick(); toast('Parts list copied'); }, () => toast("This view won't allow copying.")); } catch { toast("This view won't allow copying."); }
    return;
  }
  if (t.closest('[data-reset]')) { ['bench', 'printer', 'wb', 'slow', 'rm', 'recents', 'tip-wb'].forEach(k => { try { localStorage.removeItem('mm-proto:' + k); } catch {} }); WB = loadWB(); state.recents = []; state.slow = false; state.rmPref = false; state.unitF = false; applyRM(); setBadge(false); closeSheet(); refreshAll(); toast('Prototype data cleared. Reload to see the first-visit tip again.'); return; }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.name === 'abuild') { tick(); setActive(t.value || 'unsorted'); setTimeout(() => { closeSheet(); toast(activeBuild() ? `Active build: ${esc(activeBuild().name)}` : 'No active build. New parts go to Unsorted.'); }, 260); }
  else if (t.id === 'nbPrinter') { const o = PRINTER_OPTS.find(x => x.name === t.value); const s = $('#nbSize'); s.innerHTML = o.sizes.length ? o.sizes.map(z => `<option value="${z}" ${z === defaultSize(o.name) ? 'selected' : ''}>${z} mm</option>`).join('') : '<option value="">Not applicable</option>'; s.disabled = !o.sizes.length; $('#nbName').placeholder = buildName(o.name, defaultSize(o.name)); }
  else if (t.id === 'nbSize') { $('#nbName').placeholder = buildName($('#nbPrinter').value, t.value); }
  else if (t.id === 'wbPrinter') { const b = activeBuild(); if (b) { const auto = b.name === buildName(b.printer, b.size); b.printer = t.value; b.size = defaultSize(t.value); if (auto) b.name = buildName(b.printer, b.size); saveWB(); refreshAll(); toast(`Fit labels now check against the ${esc(b.printer)}`); } }
  else if (t.id === 'wbSize') { const b = activeBuild(); if (b) { const auto = b.name === buildName(b.printer, b.size); b.size = t.value; if (auto) b.name = buildName(b.printer, b.size); saveWB(); refreshAll(); } }
  else if (t.id === 'wbName' || t.id === 'wbNotes') { const b = activeBuild(); if (b) { if (t.id === 'wbName') b.name = t.value.trim() || buildName(b.printer, b.size); else b.notes = t.value; saveWB(); if (t.id === 'wbName') refreshAll(); } }
  else if (t.id === 'labSlow') { setSlow(t.checked); if (navigator.vibrate) tick(); }
  else if (t.id === 'labRM') { if (navigator.vibrate) tick(); state.rmPref = t.checked; store.set('rm', t.checked); applyRM(); }
  else if (t.id === 'labTargets') { if (navigator.vibrate) tick(); state.targets = t.checked; html.classList.toggle('targets', t.checked); }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'nbForm') return;
  e.preventDefault();
  const p = $('#nbPrinter').value, s = $('#nbSize').value || '';
  const b = mkBuild(p, s, $('#nbName').value);
  if ($('#nbMove')?.checked) { b.items = WB.unsorted; WB.unsorted = []; }
  WB.builds.push(b); WB.active = b.id; saveWB(); tick();
  closeSheet(); refreshAll();
  toast(`${esc(b.name)} is your active build`, state.route?.type === 'workbench' ? null : { label: 'Open', run: () => go('workbench') });
});
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'nlForm') return;
  e.preventDefault();
  const form = e.target; const input = $('#nlEmail'); const btn = $('#subBtn'); const msg = $('#nlMsg');
  if (btn.dataset.state !== 'idle') return;
  const v = input.value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    msg.textContent = 'Enter an email like you@example.com.'; msg.classList.add('err'); tick('error'); input.focus(); return;
  }
  msg.classList.remove('err'); btn.dataset.state = 'working'; btn.setAttribute('aria-busy', 'true'); msg.textContent = 'Subscribing…';
  await sleep(900);
  btn.dataset.state = 'done'; btn.removeAttribute('aria-busy'); tick();
  msg.textContent = "You're in. First issue lands Tuesday. (Prototype: nothing was sent.)";
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal.open ? closePalette() : openPalette(); return; }
  if (e.key === '/' && !e.target.closest('input, textarea') && !pal.open) { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape' && pop) { const tr = popTrigger; closePopover(); tr?.focus(); }
});
document.addEventListener('touchstart', () => {}, { passive: true });

}
